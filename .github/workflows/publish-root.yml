name: Publish static root fallback

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.source.html'
      - '.github/workflows/publish-root.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Restore Vite source entry
        run: cp index.source.html index.html
      - run: npm run build
      - name: Publish production bundle into repository root
        run: |
          rm -rf assets
          cp dist/index.html index.html
          cp -R dist/assets ./assets
      - name: Commit static bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          if git diff --cached --quiet; then
            echo "No static bundle changes"
          else
            git commit -m "chore: publish static Pages fallback [skip ci]"
            git push
          fi
